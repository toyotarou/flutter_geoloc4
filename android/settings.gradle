// ✅ pluginManagement セクション：Flutter の SDK パスとリポジトリ設定
pluginManagement {
    // 🔽 local.properties から flutter SDK のパスを取得
    def props = new Properties()
    file("local.properties").withInputStream { props.load(it) }
    def flutterSdkPath = props.getProperty("flutter.sdk")

    // 🔽 パスが未設定の場合にエラーを出す
    assert flutterSdkPath != null: "flutter.sdk not set in local.properties"

    // 🔽 Flutter のビルドツールを Gradle に組み込む
    includeBuild("${flutterSdkPath}/packages/flutter_tools/gradle")

    // 🔽 プラグイン管理用リポジトリを指定
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
        maven { url "https://storage.googleapis.com/download.flutter.io" }
    }
}

// ✅ plugins セクション：プロジェクト全体で使用する Gradle プラグインの定義
plugins {
    // 🔽 Android Gradle Plugin（Flutter の警告条件を満たす）
    id "com.android.application" version "8.11.1" apply false
    id "com.android.library" version "8.11.1" apply false

    // 🔽 Kotlin（Flutter の警告条件を満たす）
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false

    // ✅ Kotlin 2.0+ で Compose を使う場合に必須
    id "org.jetbrains.kotlin.plugin.compose" version "2.1.0" apply false

    // 🔽 Flutter 固有の Gradle プラグイン（必須）
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
}

// ✅ モジュール定義
include ":app"
